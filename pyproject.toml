[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointneuron-pn2"
version = "0.1.0"
description = "Fresh PN2 research and shared reconstruction evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=8"]
inspection = ["matplotlib"]
phase1 = ["scikit-image==0.25.2", "psutil==7.0.0", "matplotlib==3.10.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
